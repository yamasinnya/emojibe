name: Deploy to Lolipop

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Create DB config
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          printf '<?php\ndefine("DB_HOST", "%s");\ndefine("DB_NAME", "%s");\ndefine("DB_USER", "%s");\ndefine("DB_PASS", "%s");\ndefine("ANTHROPIC_API_KEY", "%s");\n' \
            "$DB_HOST" "$DB_NAME" "$DB_USER" "$DB_PASS" "$ANTHROPIC_API_KEY" > api/db_config.php

      - name: Deploy via SFTP (lftp)
        env:
          SFTP_HOST: ${{ secrets.FTP_SERVER }}
          SFTP_USER: ${{ secrets.FTP_USERNAME }}
          SFTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get install -y lftp
          printf 'machine %s login %s password %s\n' "$SFTP_HOST" "$SFTP_USER" "$SFTP_PASS" > ~/.netrc
          chmod 600 ~/.netrc
          lftp sftp://$SFTP_USER@$SFTP_HOST:2222 -e "
            set sftp:auto-confirm yes;
            set net:max-retries 3;
            mkdir -p /home/users/0/chips.jp-yama/web/emojibe;
            mirror --reverse --delete \
              --exclude-glob .git \
              --exclude-glob .github \
              --exclude-glob emojibe_field.html \
              --exclude-glob emojibe_handoff.md \
              --exclude-glob emojibe2.md \
              . /home/users/0/chips.jp-yama/web/emojibe/;
            bye;
          "
